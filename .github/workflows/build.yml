name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # A clean-install build on the deploy box's OS. e2e.yml never runs `npm run build`, which
  # is how #115 (tailwindcss 3 -> 4) merged with a client that no longer built.
  build: # name is referenced by branch protection; do not rename
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      # DocumentViewer loads pdf.js's JPEG 2000 and JBIG2 decoders from /pdfjs-wasm/. A build
      # without them still succeeds, and scanned pages then render blank (#119).
      - name: Client build ships the pdf.js decoders
        shell: bash
        run: test -f client/dist/pdfjs-wasm/jbig2.wasm && test -f client/dist/pdfjs-wasm/openjpeg.wasm
      - run: npm run lint
      # The DB-free part of the server unit suite, on the deploy box's OS: path handling
      # differs on Windows (#119: pdf.js rejected asset dirs ending in a backslash, which
      # silently stopped OCR). The DB-backed suites run in e2e.yml's api-e2e job.
      - name: Unit tests (DB-free)
        run: npm test --workspace=server -- src/lib src/middleware src/__tests__/spaFallback.test.ts
