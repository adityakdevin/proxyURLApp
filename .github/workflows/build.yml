name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # A clean-install build on the deploy box's OS. e2e.yml never runs `npm run build`, which
  # is how #115 (tailwindcss 3 -> 4) merged with a client that no longer built.
  build: # name is referenced by branch protection; do not rename
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run lint
